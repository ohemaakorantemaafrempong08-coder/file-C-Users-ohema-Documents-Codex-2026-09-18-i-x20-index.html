<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop With Franka — Seller</title><style>body{margin:0;background:#fcfaf5;color:#16231f;font:16px Arial}main{max-width:700px;margin:auto;padding:45px 22px}h1{color:#143d34;font:2.5rem Georgia}a{color:#143d34}.card{background:#fff;border:1px solid #e6e0d5;border-radius:12px;padding:23px;margin:20px 0}label{display:block;font-size:.8rem;font-weight:bold;margin:14px 0 6px}input,textarea{width:100%;padding:11px;box-sizing:border-box;border:1px solid #d9d5cd;border-radius:6px;font:inherit}textarea{height:80px}button{background:#143d34;color:#fff;border:0;border-radius:6px;padding:12px 15px;font-weight:bold;margin:16px 6px 0 0;cursor:pointer}.coral{background:#e86651}.delete{background:#a83d32;margin:0}.hidden{display:none}.item{border-top:1px solid #eee5d9;padding:14px 0;display:flex;justify-content:space-between}.note{background:#f5be45;padding:10px;border-radius:6px;font-size:.86rem}</style></head><body><main><a href="index.html">← View shop</a><h1>Seller dashboard</h1><div id="login" class="card"><p class="note">First time? Enter a strong password and create your account. Confirm the email you receive, then sign in.</p><label>Email</label><input value="ohemaakorantemaafrempong08@gmail.com" readonly><label>Password</label><input id="pass" type="password" placeholder="Your password"><button id="in">Sign in</button><button id="up" class="coral">Create account</button><p id="msg"></p></div><div id="dash" class="hidden"><div class="card"><h2>Add a product</h2><form id="form"><label>Name</label><input name="name" required><label>Price (GH₵)</label><input name="price" type="number" step="0.01" required><label>Description</label><textarea name="description"></textarea><label>Photo</label><input name="photo" type="file" accept="image/*"><label>Accent colour</label><input name="accent_color" type="color" value="#456f63"><button>Add to live shop</button></form><p id="save"></p></div><div class="card"><h2>Live products</h2><div id="items"></div></div><button id="out">Sign out</button></div></main><script>const load=s=>new Promise((ok,no)=>{let x=document.createElement('script');x.src=s;x.onload=ok;x.onerror=no;document.head.append(x)});(async()=>{await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');await load('supabase-config.js');const sb=supabase.createClient(FRANKA_SUPABASE_URL,FRANKA_SUPABASE_KEY),$=id=>document.getElementById(id),owner='ohemaakorantemaafrempong08@gmail.com';function dashboard(on){$('login').classList.toggle('hidden',on);$('dash').classList.toggle('hidden',!on);if(on)products()}async function products(){let{data}=await sb.from('products').select('*').order('created_at',{ascending:false});$('items').innerHTML=data?.length?data.map(p=>`<div class="item"><span><b>${p.name}</b><br><small>GH₵${Number(p.price).toFixed(2)}</small></span><button class="delete" data-id="${p.id}">Remove</button></div>`).join(''):'No products yet.'}$('in').onclick=async()=>{let{error}=await sb.auth.signInWithPassword({email:owner,password:$('pass').value});$('msg').textContent=error?.message||'Signed in.';if(!error)dashboard(1)};$('up').onclick=async()=>{let{error}=await sb.auth.signUp({email:owner,password:$('pass').value});$('msg').textContent=error?.message||'Confirmation email sent. Confirm it, then sign in.'};$('form').onsubmit=async e=>{e.preventDefault();let d=new FormData(e.target),f=d.get('photo'),image_url=null;$('save').textContent='Saving…';if(f?.size){let path=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'-'),r=await sb.storage.from('product-images').upload(path,f);if(r.error){$('save').textContent=r.error.message;return}image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}let{error}=await sb.from('products').insert({name:d.get('name'),price:+d.get('price'),description:d.get('description'),accent_color:d.get('accent_color'),image_url});$('save').textContent=error?.message||'Product is live.';if(!error){e.target.reset();products()}};$('items').onclick=async e=>{if(e.target.dataset.id){await sb.from('products').delete().eq('id',e.target.dataset.id);products()}};$('out').onclick=async()=>{await sb.auth.signOut();dashboard(0)};let{data}=await sb.auth.getSession();dashboard(!!data.session)})()</script></body></html>
